<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="850" viewBox="0 0 1200 850"><style>text{font-family:Arial,sans-serif;fill:#ecfff5}.title{font-size:30px;font-weight:700}.sub{font-size:16px;fill:#9fc5b5}.h{font-size:22px;font-weight:700}.t{font-size:16px}.box{fill:#102a2b;stroke:#2c8b6b;stroke-width:2}.client{fill:#182d43;stroke:#4d88ba;stroke-width:1.5}.arrow{stroke:#66d9a7;stroke-width:3;fill:none;marker-end:url(#a)}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#66d9a7"/></marker></defs><rect width="1200" height="850" rx="24" fill="#071b21"/><text x="50" y="60" class="title">Soluciones Tecnológicas Ortegón · Ecosistema STO</text><text x="50" y="89" class="sub">Tecnología que construye soluciones, no un software único para todos</text><rect class="box" x="380" y="125" width="440" height="118" rx="18"/><text x="600" y="170" class="title" text-anchor="middle">ORTEX</text><text x="600" y="200" class="t" text-anchor="middle">Comprende · Planifica · Propone · Construye</text><path class="arrow" d="M600 243V287"/><rect class="box" x="110" y="295" width="980" height="180" rx="20"/><text x="600" y="334" class="h" text-anchor="middle">Infraestructura compartida STO</text><text x="600" y="360" class="sub" text-anchor="middle">Servicios reutilizables, seguros y escalables</text><g class="t" text-anchor="middle"><text x="210" y="413">Constructor</text><text x="368" y="413">Datos</text><text x="525" y="413">Infraestructura</text><text x="682" y="413">Seguridad</text><text x="835" y="413">Integraciones</text><text x="994" y="413">Monitoreo</text></g><path class="arrow" d="M600 475V518"/><text x="600" y="555" class="h" text-anchor="middle">Soluciones independientes · Cada cliente tiene su propio entorno</text><g><rect class="client" x="52" y="585" width="255" height="130" rx="15"/><rect class="client" x="325" y="585" width="255" height="130" rx="15"/><rect class="client" x="598" y="585" width="255" height="130" rx="15"/><rect class="client" x="871" y="585" width="275" height="130" rx="15"/></g><g text-anchor="middle"><text x="180" y="624" class="h">Arturito · PILOTO</text><text x="180" y="652" class="t">Solución para mascotas</text><text x="180" y="678" class="sub">Primer caso de uso real</text><text x="452" y="624" class="h">Tienda</text><text x="452" y="652" class="t">Catálogo · Pedidos</text><text x="452" y="678" class="sub">Cliente futuro</text><text x="725" y="624" class="h">Restaurante</text><text x="725" y="652" class="t">Reservas · Menú</text><text x="725" y="678" class="sub">Cliente futuro</text><text x="1008" y="624" class="h">Empresa</text><text x="1008" y="652" class="t">Procesos específicos</text><text x="1008" y="678" class="sub">Cliente futuro</text></g><text x="50" y="768" class="h">Modelo de negocio: SaaS + Desarrollo a medida + Implementación y soporte</text><text x="50" y="806" class="sub">Objetivo de Ortex: pasar de una necesidad y un presupuesto aprobado a una solución desplegada y verificable.</text></svg>